# CodeQL, set up by hand rather than through GitHub's default setup.
#
# Swift is left out for now. Under CodeQL's build tracer, Xcode 27's compiler
# can't start its macro plugin server ("Bad CPU type in executable"), so
# @Model, @Observable and @Entry fail to expand and the build stops. Bring
# the swift entry below back once CodeQL handles Swift macros on Xcode 27.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - language: swift
          #   runner: xcode-27
          #   build-mode: manual
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          pinned="/Applications/Xcode_$(cat .xcode-version).app"
          if [[ -d "$pinned" ]]; then sudo xcode-select -s "$pinned"; fi
          xcodebuild -version
          xcodebuild -project ShutterDrop.xcodeproj -scheme ShutterDrop \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"
