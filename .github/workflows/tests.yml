# Builds ShutterDrop and runs its tests on every push and pull request, on an
# iOS 27 simulator, ShutterDrop's minimum.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Toolchain
        # .xcode-version holds the oldest Xcode ShutterDrop builds with. Picks
        # the newest Xcode on the runner, and fails here, not in a confusing
        # compile, if it's older than that.
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -n "$newest" ]]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          required="$(cut -d. -f1 .xcode-version)"
          actual="$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1] }')"
          if (( actual < required )); then
            echo "::error::Xcode $actual is older than the $required in .xcode-version"
            exit 1
          fi

      - name: Build and test
        # Simulator builds need no signing team (app/Signing.xcconfig).
        run: >-
          xcodebuild -project app/ShutterDrop.xcodeproj -scheme ShutterDrop
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro'
          -derivedDataPath "$RUNNER_TEMP/DerivedData" test
